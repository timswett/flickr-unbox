[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flickr-unbox"
version = "0.1.0"
description = "Restore real EXIF/IPTC metadata into a Flickr data export at scale."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"

[project.scripts]
flickr-unbox = "flickr_unbox.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
fixtures = ["pillow"]
# Only needed for the optional, macOS-only photos-diff/photos-import/
# photos-retry/photos-fix-dates stages (see _osxphotos.py). The core
# 8-stage pipeline stays stdlib-only. osxphotos itself requires Python
# 3.10+, a higher floor than this project's own >=3.9 -- `pip install`
# will surface that directly if attempted on 3.9. photoscript (used by
# photos-fix-dates) comes in transitively as one of osxphotos's own
# dependencies.
photos = ["osxphotos>=0.76.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.bandit]
# B404 (import subprocess) fires on the bare import itself, with no signal
# beyond "this file uses subprocess" -- the actual call sites are reviewed
# individually with inline `# nosec B603` + a reason, so this rule adds
# nothing actionable project-wide.
skips = ["B404"]
